# Role: NGINX gateway plug-in override that fronts Sock Shop and enforces request limits.

services:
  api-gateway:
    image: nginx:1.27.0-alpine
    container_name: sockshop-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateways/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front-end
    networks: [sockshop-net]
