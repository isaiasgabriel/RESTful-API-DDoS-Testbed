# Role: NGINX configuration implementing Sock Shop reverse-proxy + IP rate limiting.
events {}

http {
  limit_req_zone $binary_remote_addr zone=global_rate_limit:10m rate=100r/m;
  limit_req_status 429;

  upstream sockshop_frontend {
    server front-end:8079;
    keepalive 64;
  }

  server {
    listen 80 default_server;
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /healthz {
      default_type application/json;
      return 200 "{}";
    }

    location / {
      limit_req zone=global_rate_limit burst=20 nodelay;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_pass http://sockshop_frontend;
    }

    error_page 429 = @rate_limited;

    location @rate_limited {
      default_type application/json;
      add_header Retry-After "60" always;
      return 429 '{"error":"rate_limit_exceeded","retry_after":60}';
    }
  }
}
