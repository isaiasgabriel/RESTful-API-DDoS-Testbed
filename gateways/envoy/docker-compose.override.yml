# Role: Envoy gateway plug-in override for HTTP/2 upstream forwarding experiments.

services:
  frontend-h2-sidecar:
    image: envoyproxy/envoy:v1.30.3
    container_name: sockshop-frontend-h2-sidecar
    restart: unless-stopped
    volumes:
      - ./gateways/envoy/upstream-sidecar.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - front-end
    networks: [sockshop-net]

  api-gateway:
    image: envoyproxy/envoy:v1.30.3
    container_name: sockshop-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./gateways/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./gateways/tls:/etc/envoy/tls:ro
    depends_on:
      - frontend-h2-sidecar
    networks: [sockshop-net]
