# Role: Upstream h2 sidecar that accepts HTTP/2 from edge Envoy and proxies to Sock Shop frontend over HTTP/1.1.
static_resources:
  listeners:
    - name: sidecar_h2_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 19000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: sidecar_ingress
                codec_type: AUTO
                route_config:
                  name: sidecar_routes
                  virtual_hosts:
                    - name: sidecar_sockshop
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: sockshop_frontend_http1
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: sockshop_frontend_http1
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: sockshop_frontend_http1
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: front-end
                      port_value: 8079
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
