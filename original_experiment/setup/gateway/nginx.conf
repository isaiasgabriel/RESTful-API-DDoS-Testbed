# -----------------------------------------------------------------------------
# Lab API gateway — replicates §VI.B rate-limit policies of the paper:
#
#   X-API-KEY  prefix  AX001*  →  100 requests / minute
#   X-API-KEY  prefix  BX001*  →   70 requests / minute
#   X-API-KEY  other          →   50 requests / minute
#   per-IP                    →  100 requests / minute
#   per-USER  (X-User-Id)     →  100 requests / minute
# -----------------------------------------------------------------------------
worker_processes  auto;
events { worker_connections  4096; }

http {
    log_format combined_x '$remote_addr - "$http_x_api_key" "$http_x_user_id" '
                         '[$time_local] "$request" $status $body_bytes_sent '
                         '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout combined_x;
    error_log  /dev/stderr  warn;

    lua_shared_dict ratelimit_keys 32m;
    lua_shared_dict ratelimit_ip   32m;
    lua_shared_dict ratelimit_usr  32m;

    # Upstream microservices (resolved via Docker network).
    upstream frontend  { server front-end:8079; }
    upstream catalogue { server catalogue:80;   }
    upstream user      { server user:80;        }
    upstream carts     { server carts:80;       }
    upstream orders    { server orders:80;      }
    upstream payment   { server payment:80;     }
    upstream shipping  { server shipping:80;    }

    # ---- HTTP/1.1 (port 8080) and HTTP/2 (port 8443, h2) --------------------
    server {
        listen 8080;
        listen 8443 ssl http2;
        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Rate-limit phase runs before proxy_pass.
        access_by_lua_file /usr/local/openresty/nginx/conf/ratelimit.lua;

        # Make the rate-limit observable in OpenAPI mode.
        location = /health     { return 200 '{"status":"UP"}'; default_type application/json; }
        location = /v3/api-docs {
            default_type application/json;
            # Aggregated stub OAS so Algorithm 1 has something to parse even
            # if individual microservices don't expose one.
            return 200 '{
                "openapi":"3.0.0","info":{"title":"SockShop Lab","version":"1.0"},
                "paths":{
                    "/catalogue":{"get":{"summary":"list socks"}},
                    "/catalogue/{id}":{"get":{"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}}]}},
                    "/customers/{id}":{"get":{"parameters":[{"name":"id","in":"path","required":true}]}},
                    "/orders":{"post":{"summary":"create order"},"get":{"summary":"list orders"}},
                    "/cart":{"get":{},"post":{},"delete":{}},
                    "/cards":{"post":{}},
                    "/addresses":{"post":{}},
                    "/login":{"get":{}},
                    "/register":{"post":{}}
                }
            }';
        }

        location /catalogue { proxy_pass http://catalogue; proxy_http_version 1.1; }
        location /tags      { proxy_pass http://catalogue; proxy_http_version 1.1; }
        location /customers { proxy_pass http://user;      proxy_http_version 1.1; }
        location /cards     { proxy_pass http://user;      proxy_http_version 1.1; }
        location /addresses { proxy_pass http://user;      proxy_http_version 1.1; }
        location /login     { proxy_pass http://user;      proxy_http_version 1.1; }
        location /register  { proxy_pass http://user;      proxy_http_version 1.1; }
        location /cart      { proxy_pass http://carts;     proxy_http_version 1.1; }
        location /orders    { proxy_pass http://orders;    proxy_http_version 1.1; }
        location /paymentAuth { proxy_pass http://payment; proxy_http_version 1.1; }
        location /shipping  { proxy_pass http://shipping;  proxy_http_version 1.1; }
        location /          { proxy_pass http://frontend;  proxy_http_version 1.1; }
    }
}
